<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1356" viewBox="0 0 980 1356" role="img" aria-label="MitoM 工作流程（mitom run）">
<defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #17202a; }
.title { font-weight: 700; }
.subtitle { fill: #566573; }
.node { fill: #f8fbff; stroke: #2f6f9f; stroke-width: 2; rx: 8; }
.node-accent { fill: #eef7f1; stroke: #2f7d50; stroke-width: 2; rx: 8; }
.arrow { stroke: #586069; stroke-width: 2.4; fill: none; marker-end: url(#arrowhead); }
</style>
<marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#586069" />
</marker>
</defs>
<rect x="0" y="0" width="980" height="100%" fill="#ffffff" />
<text class="title" x="490" y="42" font-size="26" text-anchor="middle">MitoM 工作流程（mitom run）</text>
<text class="subtitle" x="490" y="72" font-size="15" text-anchor="middle">12 步，与终端的 [Step k/12] 一致</text>
<rect class="node-accent" x="140" y="112" width="700" height="72" />
<text x="490" y="140" font-size="16" text-anchor="middle" dominant-baseline="middle"><tspan x="490" dy="0">1 读入与去重</tspan><tspan x="490" dy="1.35em">同一基因组只留一条；qc/dedup_report.tsv</tspan></text>
<path class="arrow" d="M 490 189 L 490 206" />
<rect class="node" x="140" y="212" width="700" height="72" />
<text x="490" y="240" font-size="16" text-anchor="middle" dominant-baseline="middle"><tspan x="490" dy="0">2 第一轮注释</tspan><tspan x="490" dy="1.35em">13 个蛋白基因、2 个 rRNA、22 个 tRNA；核对环状 / 线状</tspan></text>
<path class="arrow" d="M 490 289 L 490 306" />
<rect class="node" x="140" y="312" width="700" height="72" />
<text x="490" y="340" font-size="16" text-anchor="middle" dominant-baseline="middle"><tspan x="490" dy="0">3 统一方向与起点</tspan><tspan x="490" dy="1.35em">正链，从 cox1（--which_gene_first）开始</tspan></text>
<path class="arrow" d="M 490 389 L 490 406" />
<rect class="node" x="140" y="412" width="700" height="72" />
<text x="490" y="440" font-size="16" text-anchor="middle" dominant-baseline="middle"><tspan x="490" dy="0">4 转动后核查，必要时第二轮注释</tspan><tspan x="490" dy="1.35em">--if_reannotation_2 auto：只重注受转动影响的记录</tspan></text>
<path class="arrow" d="M 490 489 L 490 506" />
<rect class="node" x="140" y="512" width="700" height="72" />
<text x="490" y="540" font-size="16" text-anchor="middle" dominant-baseline="middle"><tspan x="490" dy="0">5 写 GenBank</tspan><tspan x="490" dy="1.35em">写回原记录的物种、文献、标本信息</tspan></text>
<path class="arrow" d="M 490 589 L 490 606" />
<rect class="node" x="140" y="612" width="700" height="72" />
<text x="490" y="640" font-size="16" text-anchor="middle" dominant-baseline="middle"><tspan x="490" dy="0">6 补漏</tspan><tspan x="490" dy="1.35em">12S / 16S（rRNA HMM）、内含子；--rescue 时 MITOS2</tspan></text>
<path class="arrow" d="M 490 689 L 490 706" />
<rect class="node" x="140" y="712" width="700" height="72" />
<text x="490" y="740" font-size="16" text-anchor="middle" dominant-baseline="middle"><tspan x="490" dy="0">7 校正</tspan><tspan x="490" dy="1.35em">按 NCBI 规范修整端点和基因名</tspan></text>
<path class="arrow" d="M 490 789 L 490 806" />
<rect class="node" x="140" y="812" width="700" height="72" />
<text x="490" y="840" font-size="16" text-anchor="middle" dominant-baseline="middle"><tspan x="490" dy="0">8 未知 ORF 与非编码区</tspan><tspan x="490" dy="1.35em">受选择的 ORF 写成 CDS（qc/orf_report.tsv）；标出非编码区</tspan></text>
<path class="arrow" d="M 490 889 L 490 906" />
<rect class="node" x="140" y="912" width="700" height="72" />
<text x="490" y="940" font-size="16" text-anchor="middle" dominant-baseline="middle"><tspan x="490" dy="0">9 NCBI 检查与提交文件</tspan><tspan x="490" dy="1.35em">table2asn → submission/</tspan></text>
<path class="arrow" d="M 490 989 L 490 1006" />
<rect class="node" x="140" y="1012" width="700" height="72" />
<text x="490" y="1040" font-size="16" text-anchor="middle" dominant-baseline="middle"><tspan x="490" dy="0">10 与原注释比较</tspan><tspan x="490" dy="1.35em">qc/original_vs_mitom.tsv（GenBank 输入）</tspan></text>
<path class="arrow" d="M 490 1089 L 490 1106" />
<rect class="node" x="140" y="1112" width="700" height="72" />
<text x="490" y="1140" font-size="16" text-anchor="middle" dominant-baseline="middle"><tspan x="490" dy="0">11 基因组圈图</tspan><tspan x="490" dy="1.35em">annotation/plots/</tspan></text>
<path class="arrow" d="M 490 1189 L 490 1206" />
<rect class="node-accent" x="140" y="1212" width="700" height="72" />
<text x="490" y="1240" font-size="16" text-anchor="middle" dominant-baseline="middle"><tspan x="490" dy="0">12 整理输出</tspan><tspan x="490" dy="1.35em">summary.tsv、annotation/、submission/、qc/、input/、logs/</tspan></text>
</svg>
