# Our own steps: the native annotation core mito_core.py (blastx, exonerate, Infernal cmsearch, HMMER nhmmer, Java for
# MiTFi), mito_intron.py (exonerate, BLAST, Infernal), mito_curate.py / ncbi_validate.py (table2asn), optional extra
# tRNA methods for mito_trna.py (ARAGORN, tRNAscan-SE), rRNA HMM fallback (HMMER nhmmer; MAFFT only to rebuild the
# HMM library, mito_rrna_hmm.py), bwa (read depth of the genome maps, mito_plot.py). Versions = those validated 2026-10.
name: mitotools
channels: [conda-forge, bioconda]
dependencies:
  - python=3.11
  - biopython
  - exonerate=2.4.0
  - blast=2.17.0
  - infernal=1.1.5
  - table2asn=1.28.1179
  - aragorn=1.2.41
  - trnascan-se=2.0.13
  - hmmer=3.4
  - mafft=7.526
  - bwa                 # read depth ring of the genome maps (mito_plot.py, --infq); minimap2 is used instead when
                        # installed (8x faster) but is not listed: its k8 pulls sysroot_linux-64 (+0.5 GB on Linux)
  - openjdk>=17          # MiTFi (models/mitfi/mitfi_import.jar), the tRNA selection step of mito_core.py
  - matplotlib           # genome maps (mito_plot.py imports matplotlib and numpy)
  - scikit-learn=1.6.1   # MitoM-ML tRNA caller (trna_ml.py; models trained locally, cached per version)
  - defusedxml           # NCBI XML in benchmark/mito_sample.py (tests/test_mito_sample.py imports it)
  - pytest               # tests/
